# Render Blueprint: two free static sites from this repo, one per design.
#   main      → dhanwanthari-kozhikode        (design A, Vaidyasala)
#   concept-b → dhanwanthari-kozhikode-dhara  (design B, Dhara)
# Render → New → Blueprint → pick this repo (branch main) → Apply.
# Keep this file identical on both branches.
# Cache-Control on /assets matches Render's own default for pages: browsers re-check each file on
# every visit (a quick "not modified" if unchanged), so a push shows up at once instead of mixing
# new HTML with old CSS. These rules can't simply be deleted: Render keeps header rules that are
# removed from this file, so changing their value is the only way to update them from here.
services:
  - type: web
    name: dhanwanthari-kozhikode
    runtime: static
    branch: main
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Demo site: keep it out of search results until the hospital signs off. Delete at launch.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/video/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300

  - type: web
    name: dhanwanthari-kozhikode-dhara
    runtime: static
    branch: concept-b
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Demo site: keep it out of search results until the hospital signs off. Delete at launch.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/video/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300
