# Render Blueprint: two free static sites from this repo, one per design.
#   main      → dhanwanthari-kozhikode        (design A, Vaidyasala)
#   concept-b → dhanwanthari-kozhikode-dhara  (design B, Dhara)
# Render → New → Blueprint → pick this repo (branch main) → Apply.
# Keep this file identical on both branches.
# No Cache-Control overrides on purpose: Render's default (max-age=0 with an ETag) makes browsers
# check every file on each visit, so a push shows up at once instead of mixing new HTML with old CSS.
services:
  - type: web
    name: dhanwanthari-kozhikode
    runtime: static
    branch: main
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Demo site: keep it out of search results until the hospital signs off. Delete at launch.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  - type: web
    name: dhanwanthari-kozhikode-dhara
    runtime: static
    branch: concept-b
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Demo site: keep it out of search results until the hospital signs off. Delete at launch.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
